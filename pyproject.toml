[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magpie"
version = "0.1.0"
description = "Magpie: pricing robustness as attacker cost for an on-device multilingual LLM (Cohere Tiny Aya Fire), in English and Hinglish, always paired with over-refusal."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Magpie team" }]
keywords = [
    "ai-safety",
    "red-teaming",
    "robustness",
    "jailbreak",
    "over-refusal",
    "survival-analysis",
    "hinglish",
    "code-mixing",
    "tiny-aya",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core stays light so `import magpie`, the cost model, the Hinglish tools, the
# refusal matcher and the survival analysis all work with no ML stack. Heavy
# and GPU-only pieces live behind the extras below and are lazy-imported.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "huggingface-hub>=0.26",
    "tqdm>=4.64",
    "rich>=13.0",
    "typer>=0.12",
    "requests>=2.28",
]

[project.optional-dependencies]
# Local HF generation + the tiny random cohere2 CPU test fixture.
hf = [
    "torch>=2.4",
    "transformers>=5.16,<5.21",
    "accelerate>=1.0",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.20",
    "safetensors>=0.4",
]
# GPU serving on Kaggle (vLLM 0.33 pins torch==2.14 and transformers<5.21).
vllm = ["vllm>=0.33,<0.34"]
# Survival analysis, power-law fits, figures.
analysis = [
    "lifelines>=0.30",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]
# Kaggle API runner + HF publishing.
runners = ["kaggle>=2.2", "kagglehub>=0.3", "six>=1.16"]
# Dataset building and curation gates.
data = ["datasets>=3.0", "curatorkit>=0.1.22", "pyarrow>=15.0"]
# The four Lexsi Track 2 repos (chained per hackathon rules).
lexsi = [
    "safetune>=0.1.12",
    "auditkit>=1.1.3",
    "curatorkit>=0.1.22",
    "circuitkit>=0.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
magpie = "magpie.cli:app"

[project.urls]
Repository = "https://github.com/shahanxd/magpie"

[tool.setuptools.packages.find]
where = ["."]
include = ["magpie*"]

[tool.setuptools.package-data]
magpie = ["py.typed", "**/*.yaml", "**/*.yml", "**/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["results", "artifacts", ".venv", "ext"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501", # line length is handled by the formatter
    "B008", # function calls in argument defaults (typer uses this)
    "C901", # complexity
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: needs a CUDA GPU (skipped in CPU CI)",
    "slow: slow tests",
    "net: needs network / HF or Kaggle access",
]
filterwarnings = ["ignore::DeprecationWarning"]
